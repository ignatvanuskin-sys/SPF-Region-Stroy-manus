    <script>
      // Домен меняется при публикации, поэтому canonical и Open Graph URL собираем из адреса деплоя.
      ;(function () {
        var origin = window.location.origin
        var pageUrl = origin + window.location.pathname
        var cover = origin + '/og-cover.webp'

        var canonical = document.querySelector('link[rel="canonical"]')
        if (!canonical) {
          canonical = document.createElement('link')
          canonical.setAttribute('rel', 'canonical')
          document.head.appendChild(canonical)
        }
        canonical.setAttribute('href', pageUrl)

        var setMeta = function (selector, value) {
          var node = document.querySelector(selector)
          if (node) node.setAttribute('content', value)
        }
        setMeta('meta[property="og:url"]', pageUrl)
        setMeta('meta[property="og:image"]', cover)
        setMeta('meta[name="twitter:image"]', cover)
      })()
    </script>
