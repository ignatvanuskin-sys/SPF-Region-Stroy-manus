    <!--
      Картинка превью — JPEG, а не WebP. WhatsApp строит карточку ссылки строже остальных
      платформ и при неподходящем формате не ухудшает карточку, а убирает её целиком;
      поддержка WebP для og:image им не документирована. JPEG поддержан везде, поэтому
      форматных рисков у карточки нет. Размер держим с запасом к практическому потолку 300 КБ.
    -->
    <meta property="og:image" content="https://spf-region.vercel.app/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="СПФ Регион Строй — окна, двери и фасадные витражи в Астане"

    <meta name="twitter:title" content="СПФ Регион Строй — окна и конструкции в Астане" />

    <meta name="twitter:image" content="https://spf-region.vercel.app/og-cover.jpg" />

    />
    <title>СПФ Регион Строй — окна и конструкции в Астане</title>
    <script>
      // Домен меняется при публикации, поэтому canonical и Open Graph URL собираем из адреса деплоя.
      ;(function () {
        var origin = window.location.origin
        var pageUrl = origin + window.location.pathname
        var cover = origin + '/og-cover.jpg'

        var canonical = document.querySelector('link[rel="canonical"]')
        if (!canonical) {
          canonical = document.createElement('link')
          canonical.setAttribute('rel', 'canonical')
          document.head.appendChild(canonical)
        }
        canonical.setAttribute('href', pageUrl)

        var setMeta = function (selector, value) {
          var node = document.querySelector(selector)
          if (node) node.setAttribute('content', value)
        }
        setMeta('meta[property="og:url"]', pageUrl)
        setMeta('meta[property="og:image"]', cover)
        setMeta('meta[name="twitter:image"]', cover)
      })()
    </script>
